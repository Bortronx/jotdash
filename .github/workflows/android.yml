name: Android app

# Every push builds the APK (downloadable from the run's artifacts).
# Pushing a tag like v1.2.0 also publishes it as a GitHub Release, which is what
# https://github.com/Bortronx/jotdash/releases/latest/download/jotdash.apk points to.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      JOTDASH_KEYSTORE_B64: ${{ secrets.JOTDASH_KEYSTORE_B64 }}
      JOTDASH_KEYSTORE_PASS: ${{ secrets.JOTDASH_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Test offline storage and captures
        run: dotnet run --project tests/LocalStore.Tests.csproj

      - name: Install Android SDK packages
        run: dotnet build Jotdash/Jotdash.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore signing key
        run: |
          if [ -n "$JOTDASH_KEYSTORE_B64" ]; then
            echo "$JOTDASH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jotdash.keystore"
            echo "JOTDASH_KEYSTORE=$RUNNER_TEMP/jotdash.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release builds need the JOTDASH_KEYSTORE_B64 and JOTDASH_KEYSTORE_PASS secrets."
            exit 1
          else
            echo "No signing key available: building with the debug key."
          fi

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0.${{ github.run_number }}"; fi
          dotnet publish Jotdash/Jotdash.csproj -f net10.0-android -c Release -o out \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion=${{ github.run_number }}
          cp out/*-Signed.apk jotdash.apk

      - uses: actions/upload-artifact@v7
        with:
          name: jotdash-apk
          path: jotdash.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jotdash.apk --title "Jotdash $GITHUB_REF_NAME" --generate-notes
